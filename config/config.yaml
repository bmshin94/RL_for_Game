# ======================================================================
# GTA5 强化学习智能体 配置文件（重构版）
# 训练流程：preprocess -> bc -> offline_rl -> inference
# ======================================================================

app:
  recorder_fps: 60             # 录屏视频的 fps
  train_fps: 10                # 训练/推理的决策 fps（相邻状态帧间隔 1/train_fps 秒）

screen:
  monitor_id: 1                # 监控的显示器号
  width: 3840                  # 显示器宽分辨率
  height: 2160                 # 显示器高分辨率

ai:
  continue_frames_num: 10      # 连续 N 帧作为一个 state 输入
  frams_resize: 640            # 模型输入帧尺寸（保持 640，letterbox 到 640x640）
  enable: true

paths:
  model_path: "models/dueling_dqn.pth"          # 模型保存路径（BC 最优模型存于此）
  records_csv: "train_data/records.csv"         # 训练数据索引 csv
  tensorboard_dir: "runs/dueling_dqn"           # TensorBoard 日志目录

train:
  batch_size: 16                          # 训练批大小（离线 BC/RL 通用）
  epochs: 60                              # 训练轮数
  save_every: 10                          # 每多少轮存一次带轮次后缀的 checkpoint
  num_workers: 4                          # DataLoader 线程数
  pin_memory: true                        # 是否 pin_memory
  gpu_ids: [0]                            # 训练 GPU 卡号，如 [0,1]；空 [] 表示自动

inference:
  sleep_ms_when_empty: 100                # 无新帧时等待毫秒数

# ----------------------------------------------------------------------
# 网络与 RL 超参数（对应 rl/agent.py 的 AgentConfig）
# ----------------------------------------------------------------------
rl:
  gamma: 0.99                             # 折扣因子（离线单步模式内部会处理）
  lr: 0.0003                              # 学习率（AdamW）
  grad_clip: 1.0                          # 梯度裁剪阈值

  # --- 网络结构（已大幅精简以匹配数据量、保证实时）---
  model_dim: 256                          # 每帧 embedding / 时序特征维度
  temporal_encoder: "gru"                 # 时序编码器: "gru"（默认,轻量因果）或 "transformer"
  gru_layers: 1                           # GRU 层数
  transformer_layers: 2                   # Transformer 层数（temporal_encoder=transformer 时）
  transformer_heads: 4                    # 注意力头数
  transformer_dropout: 0.1                # Transformer dropout
  head_dropout: 0.3                       # 输出头 dropout（防过拟合）

  # --- 目标网络 ---
  target_update: 100                      # 硬同步间隔（use_polyak=false 时）
  polyak_tau: 0.005                       # Polyak 软同步系数
  use_polyak: true                        # 是否 Polyak 软同步

  # --- 离线 RL ---
  use_double_dqn: true                    # Double DQN
  cql_alpha: 1.0                          # CQL 保守正则强度
  awr_beta: 1.0                           # AWR 优势温度 w=exp(A/beta)
  awr_weight_clip: 20.0                   # AWR 权重上限

  # --- LR 调度 ---
  lr_warmup_steps: 500                    # 线性 warmup 步数
  lr_min_ratio: 0.01                      # cosine 衰减到 lr*该比例

  # --- 探索（仅在线交互模式）---
  exploration_method: "epsilon"
  epsilon_start: 0.15
  epsilon_end: 0.02
  epsilon_decay_steps: 50000

  # --- 推理 ---
  inference_head: "policy"                # 推理默认用哪个头: "policy"(BC后) 或 "q"(离线RL后)
  inference_topk: 3                       # 推理日志打印前 K
  inference_log_every: 30                 # 每多少次推理打印一次日志，<=0 关闭

# ----------------------------------------------------------------------
# 行为克隆 BC 配置
# ----------------------------------------------------------------------
bc:
  val_ratio: 0.2                          # 验证集比例（按录像划分）
  augment: true                           # 是否启用数据增强
  balanced_sampler: true                  # 是否用逆频率加权采样
  class_weight_temper: 0.5                # 类别/采样权重温度（0.5=1/sqrt(freq)）
  label_smoothing: 0.05                   # 标签平滑
  early_stop_patience: 15                 # 早停容忍轮数（按 val macro-F1）

# ----------------------------------------------------------------------
# 离线 RL 配置
# ----------------------------------------------------------------------
offline_rl:
  method: "awr"                           # 默认方法: "awr"(优势加权BC,推荐) 或 "cql"
  val_ratio: 0.15
  warmstart_path: ""                      # 热启动权重路径；空则用 paths.model_path(BC最优)

record:
  enable: true                            # 是否录制推理视频
  output_dir: "./videos"

# ----------------------------------------------------------------------
# 在线交互学习（实验性；无真实奖励信号时效果有限）
# ----------------------------------------------------------------------
online:
  enable: false
  action_interval_seconds: 0.2
  buffer_capacity: 2000
  min_buffer_size: 64
  train_every: 8
  batch_size: 8
  train_steps_per_trigger: 2
  offline_method: "cql"                   # 在线回放训练用的离线方法
  save_buffer_path: "./train_data/replay_buffer.npz"
  save_every_train_steps: 50
  use_per: true
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0
  per_beta_anneal_steps: 100000
  per_priority_mode: "proportional"

log:
  level: INFO
  file: "./logs/app.log"
